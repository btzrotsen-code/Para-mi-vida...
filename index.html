<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Para Ti ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
overflow-x:hidden;
color:white;
background:#0c0d1c;
}

/* Fondo cinematográfico */
.hero{
height:100vh;
position:relative;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
background:
linear-gradient(
135deg,
#090b16 0%,
#24124f 35%,
#421a73 65%,
#12172d 100%
);
overflow:hidden;
}

/* Estrellas */
.star{
position:absolute;
background:white;
border-radius:50%;
opacity:.7;
animation:twinkle 3s infinite ease-in-out;
}

@keyframes twinkle{
0%,100%{
opacity:.2;
transform:scale(1);
}
50%{
opacity:1;
transform:scale(1.8);
}
}

/* Neblina */
.hero::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 20%, rgba(123,47,247,.25), transparent 30%),
radial-gradient(circle at 80% 40%, rgba(241,7,163,.15), transparent 30%);
filter:blur(70px);
}

/* Caja principal */
.card{
position:relative;
z-index:10;
max-width:800px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.15);
padding:45px;
border-radius:30px;
backdrop-filter:blur(20px);
box-shadow:0 0 40px rgba(123,47,247,.25);
}

h1{
font-family:'Playfair Display',serif;
font-size:clamp(2.5rem,6vw,5rem);
margin-bottom:15px;
}

.subtitle{
font-size:1.2rem;
opacity:.8;
margin-bottom:30px;
}

#texto{
font-size:1.15rem;
line-height:1.9;
min-height:140px;
}

button{
margin-top:30px;
padding:15px 35px;
border:none;
border-radius:50px;
cursor:pointer;
font-size:1rem;
font-weight:600;
background:linear-gradient(45deg,#7b2ff7,#f107a3);
color:white;
transition:.4s;
}

button:hover{
transform:scale(1.06);
}

/* Galería */
.gallery{
padding:80px 20px;
display:flex;
justify-content:center;
gap:25px;
flex-wrap:wrap;
background:#0d1021;
}

.polaroid{
background:white;
padding:12px;
border-radius:10px;
width:250px;
transform:rotate(-2deg);
box-shadow:0 10px 20px rgba(0,0,0,.4);
transition:.4s;
}

.polaroid:hover{
transform:scale(1.04);
}

.polaroid img{
width:100%;
height:300px;
object-fit:cover;
border-radius:6px;
}

.polaroid p{
color:#222;
margin-top:10px;
font-weight:600;
text-align:center;
}

/* Corazones suaves */
.heart{
position:fixed;
bottom:-50px;
font-size:18px;
opacity:.3;
animation:float linear infinite;
pointer-events:none;
}

@keyframes float{
to{
transform:translateY(-120vh);
opacity:0;
}
}

/* Mensaje sorpresa */
.final{
text-align:center;
padding:100px 20px;
background:linear-gradient(#0d1021,#180f35);
}

.final h2{
font-size:3rem;
margin-bottom:20px;
}
</style>
</head>
<body>

<section class="hero">
<div class="card">

<h1>Para el amor de mi vida ❤️</h1>

<p class="subtitle">
Un pequeño rincón hecho para ti
</p>

<p id="texto"></p>

<button onclick="mostrarSorpresa()">
Abrir mi corazón ❤️
</button>

</div>
</section>

<section class="gallery">

<div class="polaroid">
<img src="foto1.jpg">
<p>Nuestro momento ❤️</p>
</div>

<div class="polaroid">
<img src="foto2.jpg">
<p>Mi lugar favorito eres tú</p>
</div>

<div class="polaroid">
<img src="foto3.jpg">
<p>Gracias por existir</p>
</div>

</section>

<section class="final" id="final">
<h2>Te amo muchísimo ❤️</h2>
<p id="mensajeFinal"></p>
</section>

<audio autoplay loop>
<source src="musica.mp3">
</audio>

<script>

/* Carta escribiéndose sola */
const texto = `
No sabía cómo explicarte lo importante que eres para mí,
así que hice algo distinto...

Gracias por cada risa, cada abrazo, cada momento.
Contigo aprendí que el amor también se siente como hogar.

Y si algún día dudas de cuánto te amo...
vuelve aquí ❤️
`;

let i = 0;

function escribir(){
if(i < texto.length){
document.getElementById("texto").innerHTML += texto.charAt(i);
i++;
setTimeout(escribir,40);
}
}

escribir();

/* Estrellas */
for(let i=0;i<120;i++){
let s=document.createElement("div");
s.className="star";

let size=Math.random()*3;

s.style.width=size+"px";
s.style.height=size+"px";
s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";
s.style.animationDuration=(2+Math.random()*4)+"s";

document.body.appendChild(s);
}

/* Corazones */
for(let i=0;i<25;i++){
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
h.style.animationDuration=
(5+Math.random()*8)+"s";

document.body.appendChild(h);
}

/* Botón sorpresa */
function mostrarSorpresa(){
document.getElementById("mensajeFinal").innerHTML=
"Gracias por existir. Eres de las cosas más bonitas que me han pasado. ❤️";
document.getElementById("final")
.scrollIntoView({behavior:"smooth"});
}
</script>

</body>
</html>
